<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Breed Classifier</title>
  <link rel="stylesheet" href="static/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.19.0/dist/tf.min.js"></script>
</head>
<body>
  <div class="background-decorations" aria-hidden="true">
    <img src="images/Chihuahua-Smooth-Coat.jpg" alt="" class="decor-img decor-1">
    <img src="images/siberian-husky-dog-breed-profile-1118000-hero-63acd0fe1e764a39b1b1e3a3550b1977.webp" alt="" class="decor-img decor-2">
    <img src="images/Berger-De-Picardie-Hund-Profil.jpg" alt="" class="decor-img decor-3">
    <img src="images/e5fe36a39479802c9907930f23981dd2.jpg" alt="" class="decor-img decor-4">
    <img src="images/8a0f8d4a4f8935d554e509c46c627ea4.jpg" alt="" class="decor-img decor-5">
    <img src="images/IMG_8692.webp" alt="" class="decor-img decor-6">
    <img src="images/c8147576e67897b410802f7501690fe8.jpg" alt="" class="decor-img decor-7">
  </div>
  <div class="page">
    <div class="card">
      <h1>Dog Breed Classifier</h1>
      <p class="description">Drag a dog image or select it to get the model prediction.</p>
      <input type="file" id="file-input" class="visually-hidden" accept="image/*" aria-label="Select image">
      <label id="drop-zone" class="drop-zone" role="button" tabindex="0" for="file-input" aria-label="Select or drop image">
        <span id="drop-text">Drag your image here or click to select.</span>
      </label>
      <div class="preview-wrapper">
        <img id="preview-image" alt="Preview" hidden>
      </div>
      <div class="controls">
        <button id="predict-button" type="button">Run inference</button>
        <button id="copy-button" type="button" disabled>Copy results</button>
      </div>
      <div id="progress" class="progress hidden" role="status" aria-live="polite">
        <div class="progress-bar"></div>
      </div>
      <div id="status" class="status" role="alert"></div>
      <div id="results-container" class="results hidden" aria-live="polite">
        <div class="top-one">
          <h2>Top-1</h2>
          <p id="top1" class="result-text"></p>
        </div>
        <div class="top-five">
          <h2>Top-5</h2>
          <table class="results-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Breed</th>
                <th>Probability</th>
              </tr>
            </thead>
            <tbody id="top5-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="static/app.js"></script>
</body>
</html>
