    <script>
        // Aplica el tema guardado al cargar la página para evitar parpadeos (FOUC)
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light');
        }
        
        // URLs de los favicons en Cloudinary
        const FAVICON_CLARO = 'https://res.cloudinary.com/dsdnpstgi/image/upload/v1757322688/agent_booster_edit1-09_zxjxgc.png';
        const FAVICON_OSCURO = 'https://res.cloudinary.com/dsdnpstgi/image/upload/v1757322688/agent_booster_edit1-08_1_woqpkq.png';
        
        // Detectar el modo del sistema y establecer el favicon correcto
        (function() {
            const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
            // Si el sistema está en modo OSCURO → usar favicon CLARO (para que contraste)
            // Si el sistema está en modo CLARO → usar favicon OSCURO (para que contraste)
            const faviconUrl = isDarkMode ? FAVICON_CLARO : FAVICON_OSCURO;
            
            // Actualizar todos los elementos de favicon inmediatamente
            const links = [
                document.getElementById('favicon'),
                document.getElementById('favicon-shortcut'),
                document.getElementById('favicon-32'),
                document.getElementById('favicon-16')
            ];
            
            links.forEach(link => {
                if (link) {
                    link.href = faviconUrl + '?v=' + Date.now();
                }
            });
        })();
        
        // Función para actualizar el favicon cuando cambia el modo del sistema
        function updateFavicon() {
            const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const faviconUrl = isDarkMode ? FAVICON_CLARO : FAVICON_OSCURO;
            
            const links = [
                document.getElementById('favicon'),
                document.getElementById('favicon-shortcut'),
                document.getElementById('favicon-32'),
                document.getElementById('favicon-16')
            ];
            
            links.forEach(link => {
                if (link) {
                    link.href = faviconUrl + '?v=' + Date.now();
                }
            });
        }
        
        // Escuchar cambios en el modo del sistema
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateFavicon);
    </script>

  <body>
